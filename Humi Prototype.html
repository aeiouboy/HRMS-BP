<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Humi · HRIS Live Prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="prod-tokens.css"/>
<style>
  :root {
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", monospace;
    --imp-bg:    #C2410C;
    --imp-fg:    #FFF1E0;
    --edit:      #5B3FD9;
    --edit-bg:   #ECE7FE;
    --edit-line: #C7BCFF;
    --save:      #0E7A5F;
    --sidebar-w: 256px;
  }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--color-canvas); color: var(--color-ink); font-family: var(--font-sans); letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; font-feature-settings: 'ss01', 'cv11'; }
  body { font-size: 14px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d8cfbf; border-radius: 999px; border: 2px solid var(--color-canvas); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── App frame ───────────────────────────────────── */
  .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }

  /* ── Impersonation ribbon (Blueprint amber) ─────── */
  .imp {
    background: var(--imp-bg); color: var(--imp-fg);
    padding: 0 24px; min-height: 30px;
    display: flex; align-items: center; gap: 10px;
    font-size: 12.5px;
  }
  .imp .label { color: rgba(255,241,224,0.75); font-weight: 500; }
  .imp .target { color: #FFFFFF; font-weight: 600; }
  .imp .target small { font-weight: 400; color: rgba(255,241,224,0.65); font-size: 11.5px; font-family: var(--mono); margin-left: 6px; letter-spacing: .02em; }
  .imp .scope { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,241,224,0.55); margin-left: 8px; }
  .imp .exit {
    margin-left: auto; background: transparent; color: #FFFFFF; border: 0; padding: 0;
    font-weight: 500; font-size: 12.5px; cursor: pointer; font-family: inherit;
    text-decoration: underline; text-decoration-color: rgba(255,255,255,0.4); text-underline-offset: 3px;
  }
  .imp .exit:hover { text-decoration-color: #FFFFFF; }

  /* ── Shell ──────────────────────────────────────── */
  .shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 0; }

  /* ── Sidebar (Blueprint nav-accordion) ─────────── */
  .sidebar {
    background: var(--color-ink);
    padding: 20px 12px 14px;
    display: flex; flex-direction: column; gap: 2px;
    height: 100vh; overflow-y: auto;
    position: sticky; top: 0;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px; }
  .brand .wordmark-img { display: block; height: 52px; width: auto; }
  .brand .wordmark {
    font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -0.04em;
    color: var(--color-canvas-soft); display: flex; align-items: center; gap: 4px;
  }
  .brand .wordmark .dot { width: 16px; height: 20px; background: var(--color-accent); border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%; position: relative; }
  .brand .wordmark .dot::before { content: ""; position: absolute; width: 9px; height: 9px; background: var(--color-accent); border-radius: 50%; top: -7px; left: 50%; transform: translateX(-50%); }
  .brand .tenant {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(231,227,216,0.5); margin-top: 4px;
    padding-left: 2px;
  }

  .nav-group { border-radius: 10px; }
  .nav-trigger {
    width: 100%; background: transparent; border: 0; color: rgba(231,227,216,0.85);
    display: grid; grid-template-columns: 18px 1fr auto auto; align-items: center; gap: 12px;
    padding: 10px 12px; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 500;
    text-align: left; border-radius: 10px;
  }
  .nav-trigger:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-trigger .icon { color: rgba(231,227,216,0.6); display: inline-flex; }
  .nav-trigger .icon svg { width: 16px; height: 16px; }
  .nav-trigger .count {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    padding: 1px 6px; border-radius: 999px;
    background: rgba(255,255,255,0.08); color: rgba(231,227,216,0.7);
  }
  .nav-trigger .chev { color: rgba(231,227,216,0.4); transition: transform .25s cubic-bezier(.4,0,.2,1); display: inline-flex; }
  .nav-trigger .chev svg { width: 12px; height: 12px; }
  .nav-group.open .nav-trigger { background: rgba(31,168,160,0.10); color: #fff; }
  .nav-group.open .nav-trigger .icon { color: var(--color-accent); }
  .nav-group.open .nav-trigger .count { background: rgba(31,168,160,0.18); color: var(--color-accent); }
  .nav-group.open .nav-trigger .chev { transform: rotate(90deg); color: var(--color-accent); }
  .nav-group.locked .nav-trigger { opacity: .35; cursor: not-allowed; }
  .nav-group.locked .nav-trigger:hover { background: transparent; }

  .nav-panel { display: grid; grid-template-rows: 0fr; overflow: hidden; transition: grid-template-rows .25s cubic-bezier(.4,0,.2,1); }
  .nav-group.open .nav-panel { grid-template-rows: 1fr; }
  .nav-panel > div { min-height: 0; }
  .nav-children { display: flex; flex-direction: column; gap: 1px; padding: 4px 0 8px 30px; position: relative; }
  .nav-children::before {
    content: ""; position: absolute; left: 26px; top: 6px; bottom: 8px; width: 1px;
    background: rgba(255,255,255,0.10);
  }
  .nav-child {
    padding: 6px 10px 6px 12px; border-radius: 6px;
    color: rgba(231,227,216,0.72); font-size: 12.5px; font-weight: 500;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    cursor: pointer; position: relative;
  }
  .nav-child::before {
    content: ""; position: absolute; left: -4px; top: 50%; width: 6px; height: 1px;
    background: rgba(255,255,255,0.10);
  }
  .nav-child:hover { background: rgba(255,255,255,0.04); color: #fff; }
  .nav-child.is-active { background: rgba(31,168,160,0.16); color: #fff; box-shadow: inset 2px 0 0 var(--color-accent); }
  .nav-child .badge {
    font-family: var(--mono); font-size: 9px; padding: 1px 5px; border-radius: 4px;
    background: rgba(91,108,224,0.22); color: #B7C2FF; font-weight: 600;
  }

  .sb-user { margin-top: auto; padding: 12px 10px 4px; display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; }
  .sb-user .av { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; color: #fff; }
  .sb-user .nm { font-size: 13px; font-weight: 600; color: var(--color-canvas-soft); line-height: 1.2; }
  .sb-user .rl { font-family: var(--mono); font-size: 10.5px; color: rgba(231,227,216,0.55); margin-top: 2px; letter-spacing: .02em; }

  /* ── Main column ─────────────────────────────────── */
  .main { min-width: 0; display: flex; flex-direction: column; padding: 0 32px 80px; background: var(--color-canvas); }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 20;
    background: rgba(246,241,232,0.85); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--color-hairline);
    margin: 0 -32px 24px; padding: 14px 32px;
  }
  .search {
    flex: 1; max-width: 360px;
    display: flex; align-items: center; gap: 10px;
    background: var(--color-surface);
    border: 1px solid var(--color-hairline-soft);
    border-radius: var(--radius-md);
    padding: 9px 14px;
    color: var(--color-ink-muted);
    font-size: 13.5px;
  }
  .search kbd { margin-left: auto; font-family: var(--mono); font-size: 10.5px; background: var(--color-canvas); border: 1px solid var(--color-hairline); padding: 2px 6px; border-radius: 4px; color: var(--color-ink-muted); }
  .tb-btn {
    width: 38px; height: 38px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 12px;
    background: var(--color-surface);
    border: 1px solid var(--color-hairline-soft);
    color: var(--color-ink-soft);
    cursor: pointer; position: relative;
  }
  .tb-btn:hover { background: var(--color-canvas-soft); }
  .tb-btn .dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; background: var(--imp-bg); border-radius: 50%; border: 1.5px solid var(--color-surface); }

  .persona-hub {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 10px 6px 8px;
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    border: 1px solid var(--color-hairline-soft);
    color: var(--color-ink-soft);
    font-size: 12.5px; font-weight: 600;
    cursor: pointer;
  }
  .persona-hub:hover { background: var(--color-canvas-soft); }
  .persona-hub .ph-chip {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; font-weight: 700;
    background: var(--color-ink); color: var(--color-canvas-soft);
    padding: 3px 7px; border-radius: 5px;
  }
  .tb-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    color: var(--color-ink); display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; cursor: pointer;
    border: 1px solid var(--color-hairline);
    background: linear-gradient(135deg, #E08864, #E8C46B);
  }

  /* ── Page header ────────────────────────────────── */
  .crumb { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .crumb b { color: var(--color-ink-soft); }
  .crumb .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--color-ink-faint); }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-title {
    font-family: var(--font-display);
    font-size: 33px; line-height: 1.1; letter-spacing: -0.025em; font-weight: 600;
    margin: 0;
  }
  .page-title em { font-style: italic; color: var(--color-accent); font-weight: 500; }
  .page-sub { font-size: 13.5px; color: var(--color-ink-muted); margin-top: 6px; max-width: 60ch; }
  .page-meta { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--color-ink-muted); display: flex; align-items: center; gap: 8px; }

  /* ── Stat strip ─────────────────────────────────── */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat {
    background: var(--color-surface); border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md); padding: 16px 20px;
  }
  .stat .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
  .stat .val {
    font-family: var(--font-display); font-size: 26px; font-weight: 700;
    margin-top: 6px; line-height: 1; letter-spacing: -0.02em;
  }
  .stat .val em { font-style: normal; color: var(--color-accent); }
  .stat .val.warn { color: var(--imp-bg); }
  .stat .sub { font-size: 11.5px; color: var(--color-ink-muted); margin-top: 6px; }

  /* ── Filter bar ─────────────────────────────────── */
  .filterbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--color-surface);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md);
    padding: 10px 12px; margin-bottom: 16px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 11px; border-radius: var(--radius-sm);
    background: var(--color-canvas-soft);
    border: 1px solid var(--color-hairline-soft);
    font-size: 12.5px; font-weight: 500; color: var(--color-ink-soft);
    cursor: pointer;
  }
  .chip:hover { background: var(--color-canvas); }
  .chip svg { color: var(--color-ink-muted); }
  .chip .k { font-family: var(--mono); font-size: 10px; color: var(--color-ink-faint); letter-spacing: .04em; }
  .ghost-btn {
    background: var(--color-surface); color: var(--color-ink-soft);
    border: 1px solid var(--color-hairline);
    padding: 8px 14px; border-radius: var(--radius-sm);
    font-weight: 600; font-size: 12.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .primary-btn {
    background: var(--color-accent); color: #fff; border: 0;
    padding: 8px 14px; border-radius: var(--radius-sm);
    font-weight: 600; font-size: 12.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .primary-btn:hover { filter: brightness(0.95); }

  /* ── Gantt ──────────────────────────────────────── */
  .gantt-card {
    background: var(--color-surface);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .gantt-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 18px 22px 14px; gap: 12px;
    border-bottom: 1px solid var(--color-hairline-soft);
  }
  .gantt-head .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
  .gantt-head .title { font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: -0.015em; margin-top: 4px; }
  .gantt-head .meta { font-family: var(--mono); font-size: 11px; color: var(--color-ink-muted); letter-spacing: .04em; }

  .gantt { display: grid; grid-template-columns: 240px 76px 1fr; }
  .gantt-h { display: contents; }
  .gantt-h > div {
    background: var(--color-canvas-soft);
    padding: 10px 18px;
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--color-ink-faint);
    border-bottom: 1px solid var(--color-hairline);
  }
  .gantt-h .hour-row {
    display: grid; grid-template-columns: repeat(24, 1fr);
    padding: 0;
  }
  .gantt-h .hour-row span {
    padding: 10px 0; text-align: center;
    font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--color-ink-faint);
    border-left: 1px solid var(--color-hairline-soft);
    letter-spacing: .02em;
  }
  .gantt-h .hour-row span:first-child { border-left: 0; }
  .gantt-h .hour-row span.shade { background: rgba(14,27,44,.025); }

  .gantt-row { display: contents; }
  .gantt-row > div { padding: 14px 18px; border-bottom: 1px solid var(--color-hairline-soft); display: flex; align-items: center; }
  .emp-cell { gap: 12px; }
  .emp-av {
    width: 30px; height: 30px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .emp-name { font-family: var(--font-display); font-weight: 600; color: var(--color-ink); font-size: 14px; line-height: 1.2; letter-spacing: -0.005em; }
  .emp-meta { font-family: var(--mono); font-size: 10.5px; color: var(--color-ink-muted); margin-top: 2px; letter-spacing: .02em; }
  .total-cell { font-family: var(--mono); font-weight: 700; color: var(--color-ink); font-size: 13px; letter-spacing: .02em; }
  .total-cell.under { color: var(--imp-bg); }

  .timeline { position: relative; padding: 0; border-bottom: 1px solid var(--color-hairline-soft); min-height: 58px; }
  .timeline .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(24, 1fr); pointer-events: none; }
  .timeline .grid span { border-left: 1px solid var(--color-hairline-soft); }
  .timeline .grid span:first-child { border-left: 0; }
  .timeline .grid span.shade { background: rgba(14,27,44,.025); }

  .now { position: absolute; top: -4px; bottom: -4px; width: 1.5px; background: var(--imp-bg); z-index: 4; pointer-events: none; }
  .now::before { content: ""; position: absolute; top: -3px; left: -3.5px; width: 8px; height: 8px; border-radius: 50%; background: var(--imp-bg); }

  .shift {
    position: absolute;
    top: 11px; bottom: 11px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    color: #06241F;
    background: var(--color-accent-soft);
    border: 1px solid #93D6CF;
    box-shadow: 0 1px 0 rgba(14,27,44,.04);
    overflow: hidden;
    cursor: pointer;
    z-index: 3;
    letter-spacing: .02em;
  }
  .shift:hover { filter: brightness(.97); }
  .shift.s-mgr  { background: var(--color-accent-alt-soft); border-color: #B5BBF1; color: #1c2466; }
  .shift.s-pt   { background: #FEF3C7; border-color: #EBD58A; color: #6B4E14; }
  .shift.s-night { background: #1d2b48; border-color: #2b3d63; color: #c9d7f0; }
  .shift .h { opacity: .65; font-weight: 500; }
  .shift .brk {
    position: absolute; top: 3px; bottom: 3px;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.7) 0 3px, transparent 3px 6px);
    border-radius: 4px;
  }

  /* simple coverage strip */
  .cov-strip-row {
    display: grid;
    grid-template-columns: 240px 76px 1fr;
    background: var(--color-canvas-soft);
    border-bottom: 1px solid var(--color-hairline);
    align-items: stretch;
  }
  .cov-strip-label {
    padding: 14px 18px;
    display: flex; flex-direction: column; gap: 4px; justify-content: center;
  }
  .cov-strip-eyebrow {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-ink-faint); font-weight: 700;
  }
  .cov-strip-summary {
    font-family: var(--font-display); font-size: 14px; color: var(--color-ink-soft);
    letter-spacing: -0.005em;
  }
  .cov-strip-total {
    padding: 14px 18px;
    display: flex; align-items: center; gap: 3px;
    font-family: var(--mono); color: var(--imp-bg); font-weight: 700;
  }
  .cov-strip-total b { font-size: 15px; letter-spacing: .02em; }
  .cov-strip-total small { font-size: 9.5px; color: var(--color-ink-faint); font-weight: 600; letter-spacing: .04em; }
  .cov-strip {
    display: grid; grid-template-columns: repeat(24, 1fr);
    padding: 14px 0;
    border-left: 1px solid var(--color-hairline-soft);
    gap: 2px;
    align-items: center;
  }
  .cov-cell { height: 18px; border-radius: 4px; }
  .cov-cell.ok   { background: var(--color-accent); }
  .cov-cell.gap  { background: var(--imp-bg); }
  .cov-cell.over { background: var(--color-accent-alt); opacity: .6; }
  .cov-cell.off  { background: var(--color-hairline); height: 4px; }

  .legend {
    display: flex; align-items: center; gap: 16px;
    padding: 13px 22px;
    border-top: 1px solid var(--color-hairline-soft);
    font-family: var(--mono); font-size: 10.5px; color: var(--color-ink-muted); flex-wrap: wrap;
    letter-spacing: .02em;
  }
  .legend .lg-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend .lg-sw { width: 18px; height: 10px; border-radius: 3px; }
  .legend .lg-pip { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ── Persona switcher panel ─────────────────────── */
  .ps-overlay {
    position: fixed; inset: 0; background: rgba(14,27,44,.45);
    z-index: 50; display: flex; align-items: flex-start; justify-content: flex-end;
    padding: 72px 32px 24px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .ps-overlay.open { opacity: 1; pointer-events: auto; }
  .ps-panel {
    width: 380px; max-width: 100%;
    background: var(--color-surface);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    transform: translateY(-8px);
    transition: transform .25s;
  }
  .ps-overlay.open .ps-panel { transform: translateY(0); }
  .ps-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--color-hairline-soft); }
  .ps-head .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
  .ps-head h3 { margin: 4px 0 0; font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: -0.015em; }
  .ps-list { padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .ps-opt {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px;
    border-radius: var(--radius-sm); cursor: pointer;
    border: 1px solid transparent; text-align: left;
    background: transparent; width: 100%; font-family: inherit;
  }
  .ps-opt:hover { background: var(--color-canvas-soft); }
  .ps-opt.sel { background: var(--color-accent-soft); border-color: #93D6CF; }
  .ps-opt .ps-av { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: #fff; }
  .ps-opt .ps-nm { font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--color-ink); line-height: 1.2; letter-spacing: -0.005em; }
  .ps-opt .ps-rl { font-family: var(--mono); font-size: 10.5px; color: var(--color-ink-muted); margin-top: 3px; letter-spacing: .02em; }
  .ps-access { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .ps-access .ac-chip {
    font-family: var(--mono); font-size: 9px; padding: 2px 7px; border-radius: 999px;
    background: var(--color-canvas); color: var(--color-ink-faint);
    font-weight: 700; letter-spacing: .08em;
    border: 1px solid var(--color-hairline);
  }
  .ps-access .ac-chip.on { background: var(--color-ink); color: var(--color-canvas-soft); border-color: var(--color-ink); }
  .ps-foot {
    padding: 10px 20px 14px;
    background: var(--color-canvas-soft);
    font-family: var(--mono); font-size: 10.5px; color: var(--color-ink-muted);
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--color-hairline-soft);
    letter-spacing: .02em;
  }

  /* ── Mobile parts (hidden on desktop) ──────────── */
  .bottom-nav, .mob-topbar, .mob-page, .mob-sheet, .mob-sheet-backdrop { display: none; }

  /* ── Responsive: < 1024px ──────────────────────── */
  @media (max-width: 1023px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .topbar { display: none; }
    .main { padding: 0; }
    .main > .crumb, .main > .page-head, .main > .stat-grid, .main > .filterbar, .main > .gantt-card, .main > .empty-page { display: none; }

    .mob-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      background: rgba(246,241,232,0.92); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-hairline);
      position: sticky; top: 0; z-index: 30;
    }
    .mob-topbar .brand .wordmark-img { height: 38px; }
    .mob-topbar .brand .wordmark { font-size: 20px; color: var(--color-ink); }
    .mob-topbar .brand .wordmark .dot { width: 12px; height: 15px; }
    .mob-topbar .brand .wordmark .dot::before { width: 7px; height: 7px; top: -5px; }
    .mob-topbar .right { display: flex; align-items: center; gap: 10px; }
    .mob-topbar .persona-hub { padding: 5px 8px; }
    .mob-topbar .tb-avatar { width: 32px; height: 32px; font-size: 12px; }

    .mob-page { display: block; padding: 14px 16px 96px; background: var(--color-canvas); min-height: 100vh; }
    .mob-date {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--color-surface); border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      padding: 12px 14px; margin-bottom: 12px;
    }
    .mob-date .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
    .mob-date strong { font-family: var(--font-display); font-size: 15px; font-weight: 600; display: block; margin-top: 2px; letter-spacing: -0.01em; }
    .mob-date .nav { display: inline-flex; align-items: center; gap: 8px; }
    .mob-date .nav button { background: var(--color-canvas-soft); border: 1px solid var(--color-hairline-soft); width: 32px; height: 32px; border-radius: 8px; color: var(--color-ink-soft); }
    .mob-date .nav .today { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--color-ink-soft); background: var(--color-canvas-soft); border: 1px solid var(--color-hairline-soft); padding: 7px 10px; border-radius: 8px; }

    .mob-card {
      background: var(--color-surface); border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px;
    }
    .mob-card .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
    .mob-card h4 { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: -0.015em; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
    .mob-stat { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; padding: 8px 0; border-top: 1px solid var(--color-hairline-soft); }
    .mob-stat:first-of-type { border-top: 0; }
    .mob-stat .val { font-family: var(--mono); font-weight: 700; color: var(--color-ink); letter-spacing: .02em; font-size: 12px; }
    .mob-stat .val.warn { color: var(--imp-bg); }

    .mob-emp { padding: 14px 0; border-bottom: 1px solid var(--color-hairline-soft); }
    .mob-emp:last-child { border-bottom: 0; padding-bottom: 4px; }
    .mob-emp .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .mob-emp .head .av { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; }
    .mob-emp .nm { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: -0.005em; }
    .mob-emp .meta { font-family: var(--mono); font-size: 10.5px; color: var(--color-ink-muted); margin-top: 2px; letter-spacing: .02em; }
    .mob-emp .tl-tag { margin-left: auto; font-family: var(--mono); font-size: 10.5px; padding: 3px 8px; border-radius: 999px; background: var(--color-accent-soft); color: #064B47; font-weight: 700; letter-spacing: .02em; }
    .mob-emp .tl {
      position: relative; height: 30px; background: var(--color-canvas-soft);
      border-radius: 8px; overflow: hidden; border: 1px solid var(--color-hairline-soft);
    }
    .mob-emp .tl-bar {
      position: absolute; top: 3px; bottom: 3px; border-radius: 5px;
      background: var(--color-accent-soft); border: 1px solid #93D6CF;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 8px; font-family: var(--mono); font-size: 10px; font-weight: 600; color: #06241F;
      letter-spacing: .02em;
    }
    .mob-emp .tl-scale { display: flex; justify-content: space-between; margin-top: 5px; font-family: var(--mono); font-size: 9.5px; color: var(--color-ink-faint); letter-spacing: .04em; }

    .bottom-nav {
      display: grid; grid-template-columns: repeat(4, 1fr);
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: rgba(252,250,245,0.94);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--color-hairline);
      padding: 6px 4px env(safe-area-inset-bottom);
    }
    .bn-tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 9px 4px 8px; background: transparent; border: 0;
      color: var(--color-ink-muted); cursor: pointer;
      font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      position: relative;
    }
    .bn-tab svg { color: var(--color-ink-muted); width: 18px; height: 18px; }
    .bn-tab.active { color: var(--color-ink); }
    .bn-tab.active svg { color: var(--color-accent); }
    .bn-tab.active::before {
      content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 2px;
      background: var(--color-accent); border-radius: 0 0 3px 3px;
    }
    .bn-tab.locked { opacity: .32; cursor: not-allowed; }
    .bn-tab .lock-ico { position: absolute; top: 6px; right: 18px; color: var(--color-ink-faint); }

    .mob-sheet-backdrop {
      display: block;
      position: fixed; inset: 0; background: rgba(14,27,44,.4); z-index: 45;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .mob-sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .mob-sheet {
      display: block;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 46;
      background: var(--color-surface);
      border-radius: 22px 22px 0 0;
      border-top: 1px solid var(--color-hairline);
      transform: translateY(110%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      max-height: 72vh; overflow-y: auto;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .mob-sheet.open { transform: translateY(0); }
    .mob-sheet .handle { width: 36px; height: 4px; background: var(--color-hairline); border-radius: 999px; margin: 10px auto 6px; }
    .mob-sheet .sh-head { display: flex; align-items: center; gap: 10px; padding: 10px 20px 14px; border-bottom: 1px solid var(--color-hairline-soft); }
    .mob-sheet .sh-ico { width: 32px; height: 32px; border-radius: 8px; background: var(--color-accent-soft); color: var(--color-accent); display: inline-flex; align-items: center; justify-content: center; }
    .mob-sheet .sh-eyebrow { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
    .mob-sheet .sh-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .mob-sheet .sh-pill { margin-left: auto; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent); background: var(--color-accent-soft); padding: 4px 8px; border-radius: 999px; font-weight: 700; }
    .mob-sheet .sh-close { background: var(--color-canvas-soft); border: 1px solid var(--color-hairline-soft); width: 30px; height: 30px; border-radius: 8px; color: var(--color-ink-soft); display: inline-flex; align-items: center; justify-content: center; }
    .mob-sheet .sh-list { padding: 6px 8px 16px; }
    .mob-sheet .sh-leaf {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px; border-radius: var(--radius-sm);
      font-size: 14.5px; color: var(--color-ink-soft); cursor: pointer; font-weight: 500;
    }
    .mob-sheet .sh-leaf:hover { background: var(--color-canvas-soft); }
    .mob-sheet .sh-leaf.active { background: var(--color-accent-soft); color: var(--color-ink); font-weight: 700; box-shadow: inset 2px 0 0 var(--color-accent); }
    .mob-sheet .sh-leaf .b {
      margin-left: auto; font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 4px;
      background: var(--color-accent-alt-soft); color: #2d3a9c; font-weight: 600;
    }
    .mob-sheet .sh-leaf .pip { width: 5px; height: 5px; border-radius: 50%; background: var(--color-hairline); }
    .mob-sheet .sh-leaf.active .pip { background: var(--color-accent); }

    .persona-hub .ph-label { display: none; }

    .imp { padding: 0 16px; font-size: 11.5px; }
    .imp .scope { display: none; }
    .imp .exit { font-size: 11.5px; }
  }

  /* ── Date nav (page header) ─────────────────────── */
  .date-nav { display: inline-flex; align-items: center; gap: 6px; }
  .date-nav-btn {
    width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--color-surface); border: 1px solid var(--color-hairline);
    border-radius: var(--radius-sm); color: var(--color-ink-soft); cursor: pointer;
  }
  .date-nav-btn:hover { background: var(--color-canvas-soft); }
  .date-nav-today {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--color-surface); border: 1px solid var(--color-hairline);
    border-radius: var(--radius-sm); color: var(--color-ink-soft);
    padding: 8px 14px; font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .06em; cursor: pointer;
  }
  .date-nav-today.is-today { background: var(--color-ink); color: var(--color-canvas-soft); border-color: var(--color-ink); }
  .date-nav-today:hover { background: var(--color-canvas-soft); }
  .date-nav-today.is-today:hover { background: var(--color-ink); filter: brightness(1.15); }

  /* ── Filter chip dropdown ───────────────────────── */
  .chip-wrap { position: relative; }
  .chip.open { background: var(--color-canvas); border-color: var(--color-accent); color: var(--color-ink); }
  .chip-menu {
    position: absolute; top: calc(100% + 6px); left: 0; min-width: 200px;
    background: var(--color-surface); border: 1px solid var(--color-hairline);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
    padding: 4px; z-index: 30;
  }
  .chip-menu-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: transparent; border: 0; padding: 8px 10px;
    border-radius: 6px; cursor: pointer; font-size: 12.5px;
    color: var(--color-ink-soft); font-family: inherit; font-weight: 500;
  }
  .chip-menu-item:hover { background: var(--color-canvas-soft); color: var(--color-ink); }
  .chip-menu-item.sel { color: var(--color-accent); font-weight: 700; }
  .chip-menu-item svg { color: var(--color-accent); flex-shrink: 0; }

  /* ── Topbar popovers ────────────────────────────── */
  .popover-wrap { position: relative; }
  .popover {
    position: absolute; top: calc(100% + 8px); right: 0;
    width: 300px; background: var(--color-surface);
    border: 1px solid var(--color-hairline); border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg); overflow: hidden;
    z-index: 30;
  }
  .popover-head {
    padding: 12px 16px; font-family: var(--font-display); font-size: 14px; font-weight: 600;
    border-bottom: 1px solid var(--color-hairline-soft);
    display: flex; align-items: center; justify-content: space-between;
  }
  .popover-tag {
    font-family: var(--mono); font-size: 9.5px; padding: 2px 7px; border-radius: 999px;
    background: var(--imp-bg); color: #fff; font-weight: 700; letter-spacing: .04em;
  }
  .popover-row {
    display: block; width: 100%; text-align: left;
    padding: 11px 16px; background: transparent; border: 0;
    border-bottom: 1px solid var(--color-hairline-soft);
    cursor: pointer; font-family: inherit;
    border-left: 3px solid transparent;
  }
  .popover-row:hover { background: var(--color-canvas-soft); }
  .popover-row.warn { border-left-color: var(--imp-bg); }
  .popover-row.info { border-left-color: var(--color-accent-alt); }
  .popover-row.ok   { border-left-color: var(--color-accent); }
  .popover-row-title { font-size: 13px; font-weight: 600; color: var(--color-ink); }
  .popover-row-sub { font-size: 11.5px; color: var(--color-ink-muted); margin-top: 2px; }
  .popover-foot {
    display: block; width: 100%; padding: 10px 16px;
    background: var(--color-canvas-soft); border: 0; border-top: 1px solid var(--color-hairline-soft);
    font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--color-accent);
    letter-spacing: .04em; cursor: pointer; text-align: left;
  }
  .popover-foot:hover { background: var(--color-canvas); }

  /* ── Shift bar (clickable now — was div, now button) ─ */
  .shift, .shift-add { font: inherit; }
  .shift { cursor: pointer; }
  .shift:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .shift-add {
    position: absolute; left: 8px; right: 8px; top: 11px; bottom: 11px;
    background: transparent; border: 1px dashed var(--color-hairline);
    border-radius: 7px; color: var(--color-ink-faint);
    font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer;
  }
  .shift-add:hover { background: var(--color-canvas-soft); border-color: var(--color-accent); color: var(--color-accent); }

  /* ── Shift Editor Drawer ────────────────────────── */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(14,27,44,.4); z-index: 55;
    animation: fadeIn .2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 96vw;
    background: var(--color-surface); border-left: 1px solid var(--color-hairline);
    box-shadow: var(--shadow-lg); z-index: 56;
    display: flex; flex-direction: column;
    animation: slideIn .25s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  .drawer-head {
    padding: 18px 22px 16px;
    border-bottom: 1px solid var(--color-hairline-soft);
    position: relative;
  }
  .drawer-eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-ink-faint); font-weight: 700;
  }
  .drawer-title { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .drawer-av { width: 38px; height: 38px; border-radius: 50%; font-size: 13px; }
  .drawer-x {
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--color-canvas-soft); border: 1px solid var(--color-hairline-soft);
    color: var(--color-ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .drawer-x:hover { background: var(--color-canvas); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px 12px; display: flex; flex-direction: column; gap: 18px; }
  .drawer-foot {
    padding: 14px 22px; border-top: 1px solid var(--color-hairline-soft);
    display: flex; align-items: center; gap: 10px;
    background: var(--color-canvas-soft);
  }
  .ghost-btn.danger { color: var(--imp-bg); border-color: #f0c6b3; background: #fdf3ee; }
  .ghost-btn.danger:hover { background: #fbe7dd; }

  /* drawer preview bar */
  .drawer-preview {
    position: relative;
    height: 56px;
    background: var(--color-canvas-soft);
    border: 1px solid var(--color-hairline-soft);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .drawer-preview-bar {
    position: absolute; top: 8px; bottom: 22px;
    background: var(--color-accent-soft); border: 1px solid #93D6CF; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; font-weight: 700; color: #06241F;
    letter-spacing: .02em;
    transition: left .15s, width .15s;
  }
  .drawer-preview-brk {
    position: absolute; top: 3px; bottom: 3px;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.7) 0 3px, transparent 3px 6px);
    border-radius: 4px;
  }
  .drawer-preview-axis { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; }
  .drawer-preview-axis span {
    position: absolute; transform: translateX(-50%);
    font-family: var(--mono); font-size: 9.5px; color: var(--color-ink-faint); font-weight: 600; letter-spacing: .04em;
  }

  /* Form grid + Time fields */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .time-field { display: flex; flex-direction: column; gap: 6px; }
  .time-field label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-ink-faint); font-weight: 700;
  }
  .time-input-wrap {
    display: flex; align-items: center;
    background: var(--color-surface);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .time-input-wrap:focus-within { border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(31,168,160,.15); }
  .time-input-wrap input {
    flex: 1; border: 0; padding: 9px 10px;
    font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--color-ink);
    text-align: center; background: transparent;
    letter-spacing: .04em; min-width: 0;
  }
  .time-input-wrap input:focus { outline: none; }
  .time-input-wrap .step {
    width: 36px; height: 38px;
    background: var(--color-canvas-soft); border: 0;
    color: var(--color-ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .time-input-wrap .step:hover { background: var(--color-accent-soft); color: var(--color-accent); }

  .form-stat {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    background: var(--color-canvas-soft);
    border: 1px solid var(--color-hairline-soft);
    border-radius: var(--radius-sm);
    font-family: var(--mono); font-size: 12px; color: var(--color-ink-muted);
    letter-spacing: .02em;
  }
  .form-stat .lbl { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
  .form-stat b { color: var(--color-ink); font-weight: 700; font-size: 13px; margin-left: 4px; }

  .presets-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-ink-faint); font-weight: 700; margin-bottom: 8px;
  }
  .presets, .variant-block, .break-block { display: flex; flex-direction: column; gap: 0; }
  .presets-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
  .preset-btn {
    background: var(--color-surface); border: 1px solid var(--color-hairline);
    color: var(--color-ink-soft); padding: 7px 6px; border-radius: 7px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    letter-spacing: .02em; cursor: pointer;
  }
  .preset-btn:hover { background: var(--color-accent-soft); border-color: #93D6CF; color: #06241F; }
  .presets-row:last-child { margin-bottom: 0; }

  .break-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .break-head svg { color: var(--color-ink-muted); }
  .break-head span { font-family: var(--font-display); font-size: 14px; font-weight: 600; flex: 1; }
  .break-toggle {
    padding: 5px 10px; border-radius: 6px; border: 1px solid;
    font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: .04em; cursor: pointer;
  }
  .break-toggle.on  { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
  .break-toggle.off { background: var(--color-surface); color: var(--imp-bg); border-color: #f0c6b3; }
  .break-toggle:hover { filter: brightness(.95); }

  .variant-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .variant-chip {
    display: inline-flex; flex-direction: column; align-items: center; gap: 6px;
    background: var(--color-surface); border: 1.5px solid var(--color-hairline);
    border-radius: 8px; padding: 9px 6px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    color: var(--color-ink-soft); cursor: pointer;
    letter-spacing: .02em;
  }
  .variant-chip:hover { border-color: var(--color-ink-faint); }
  .variant-chip.sel { border-color: var(--color-accent); background: var(--color-accent-soft); color: #06241F; }
  .variant-sw { display: block; width: 26px; height: 12px; border-radius: 3px; border: 1px solid; }

  /* ── Modal (Bulk assign) ────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(14,27,44,.45);
    z-index: 55; display: flex; align-items: center; justify-content: center;
    padding: 24px; animation: fadeIn .2s;
  }
  .modal {
    background: var(--color-surface); border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
    width: 520px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal-head {
    padding: 18px 22px 16px; border-bottom: 1px solid var(--color-hairline-soft);
    position: relative;
  }
  .modal-head h3 { margin: 6px 0 0; font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: -0.015em; }
  .modal-body { padding: 18px 22px; overflow-y: auto; }
  .modal-foot { padding: 14px 22px; border-top: 1px solid var(--color-hairline-soft); display: flex; align-items: center; justify-content: flex-end; gap: 10px; background: var(--color-canvas-soft); }

  .bulk-staff { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; max-height: 240px; overflow-y: auto; }
  .bulk-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .bulk-row:hover { background: var(--color-canvas-soft); }
  .bulk-row input { width: 16px; height: 16px; accent-color: var(--color-accent); cursor: pointer; }
  .bulk-current {
    font-family: var(--mono); font-size: 11px; color: var(--color-ink-muted); font-weight: 600;
    letter-spacing: .02em;
  }

  /* ── Toast host ─────────────────────────────────── */
  .toast-host {
    position: fixed; bottom: 24px; right: 24px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 70; pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--color-ink); color: var(--color-canvas-soft);
    border-radius: var(--radius-sm); padding: 12px 14px;
    min-width: 280px; max-width: 380px;
    box-shadow: var(--shadow-lg);
    animation: toastIn .2s cubic-bezier(.4,0,.2,1);
  }
  @keyframes toastIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .toast-success { border-left: 3px solid var(--color-accent); }
  .toast-warn    { border-left: 3px solid var(--imp-bg); }
  .toast-info    { border-left: 3px solid var(--color-accent-alt); }
  .toast-ico {
    width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.12); color: var(--color-canvas-soft);
    flex-shrink: 0; margin-top: 1px;
  }
  .toast-success .toast-ico { background: var(--color-accent); color: #04241f; }
  .toast-warn .toast-ico    { background: var(--imp-bg); color: #fff; }
  .toast-body { flex: 1; min-width: 0; }
  .toast-msg { font-size: 13px; font-weight: 600; color: #fff; }
  .toast-detail {
    font-family: var(--mono); font-size: 11px; color: rgba(231,227,216,.7);
    margin-top: 3px; letter-spacing: .02em;
  }
  .toast-action {
    background: transparent; border: 1px solid rgba(231,227,216,.25); color: var(--color-canvas-soft);
    padding: 4px 9px; border-radius: 6px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: .04em; cursor: pointer;
  }
  .toast-action:hover { background: rgba(231,227,216,.1); }
  .toast-close {
    background: transparent; border: 0; color: rgba(231,227,216,.6);
    width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 4px; flex-shrink: 0;
  }
  .toast-close:hover { color: #fff; background: rgba(255,255,255,.08); }

  /* ── Inline screens ─────────────────────────────── */
  .screen { display: flex; flex-direction: column; gap: 16px; }
  .screen-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .screen-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
  .screen-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin: 6px 0 0; }
  .screen-title em { font-style: italic; color: var(--color-accent); font-weight: 500; }
  .screen-sub { font-size: 13px; color: var(--color-ink-muted); margin-top: 4px; }
  .screen-actions { display: inline-flex; align-items: center; gap: 10px; }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat-card {
    background: var(--color-surface);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md);
    padding: 14px 16px;
  }
  .stat-card-eyebrow {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-ink-faint); font-weight: 700;
  }
  .stat-card-value {
    font-family: var(--font-display); font-size: 24px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.1; margin-top: 6px; color: var(--color-ink);
  }
  .stat-card-sub { font-size: 11.5px; color: var(--color-ink-muted); margin-top: 4px; }

  .screen-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .card-head {
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--color-hairline-soft);
  }
  .card-eyebrow {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-ink-faint); font-weight: 700;
  }
  .card-title {
    font-family: var(--font-display); font-size: 16px; font-weight: 600;
    letter-spacing: -0.01em; margin-top: 3px;
  }
  .card-list { display: flex; flex-direction: column; }
  .card-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--color-hairline-soft);
  }
  .card-row:last-child { border-bottom: 0; }
  .card-row-time {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    color: var(--color-ink); letter-spacing: .02em; min-width: 50px;
  }
  .card-row-title { font-size: 13.5px; font-weight: 600; color: var(--color-ink); }
  .card-row-sub { font-family: var(--mono); font-size: 11px; color: var(--color-ink-muted); margin-top: 2px; letter-spacing: .02em; }
  .card-row-body { flex: 1; min-width: 0; }

  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px; }
  .quick-tile {
    display: flex; align-items: center; gap: 10px;
    background: var(--color-canvas-soft);
    border: 1px solid var(--color-hairline-soft);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 13px; font-weight: 600; color: var(--color-ink);
    cursor: pointer; font-family: inherit;
    text-align: left;
  }
  .quick-tile:hover { background: var(--color-canvas); border-color: var(--color-hairline); }
  .quick-ico {
    width: 28px; height: 28px; border-radius: 7px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 13px;
    flex-shrink: 0;
  }

  /* tabs */
  .tabs { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--color-hairline); }
  .tab {
    padding: 9px 14px; background: transparent; border: 0;
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--color-ink-muted); cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--color-ink); }
  .tab.is-active { color: var(--color-ink); border-bottom-color: var(--color-accent); }

  /* key-value grid */
  .kv-grid { display: grid; grid-template-columns: 1fr 1fr; padding: 4px 18px; }
  .kv { padding: 12px 4px; border-bottom: 1px solid var(--color-hairline-soft); display: flex; flex-direction: column; gap: 3px; }
  .kv-k {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-ink-faint); font-weight: 700;
  }
  .kv-v { font-size: 13.5px; color: var(--color-ink); font-weight: 500; }

  /* data tables */
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table thead th {
    text-align: left; padding: 11px 18px;
    background: var(--color-canvas-soft);
    border-bottom: 1px solid var(--color-hairline);
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--color-ink-faint); font-weight: 700;
  }
  .data-table thead th.num, .data-table tbody td.num { text-align: right; font-family: var(--mono); letter-spacing: .02em; }
  .data-table tbody td {
    padding: 12px 18px;
    border-bottom: 1px solid var(--color-hairline-soft);
    color: var(--color-ink-soft);
    vertical-align: middle;
  }
  .data-table tbody tr:hover { background: var(--color-canvas-soft); }
  .data-table tbody tr:last-child td { border-bottom: 0; }
  .data-table tbody td b { color: var(--color-ink); font-weight: 600; }
  .row-link {
    background: transparent; border: 0; cursor: pointer;
    color: var(--color-accent); font-family: var(--mono); font-size: 11px;
    font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .row-link:hover { background: var(--color-accent-soft); }

  /* segmented control (Approvals filters) */
  .seg { display: inline-flex; align-items: center; background: var(--color-surface); border: 1px solid var(--color-hairline); border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
  .seg-btn {
    padding: 6px 11px; border-radius: 6px; background: transparent; border: 0;
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    color: var(--color-ink-muted); cursor: pointer;
  }
  .seg-btn:hover { color: var(--color-ink); }
  .seg-btn.is-active { background: var(--color-ink); color: var(--color-canvas-soft); }

  /* mini action buttons (approve/reject in table rows) */
  .approve-actions { display: inline-flex; align-items: center; gap: 6px; }
  .mini-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 6px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    cursor: pointer; border: 1px solid;
  }
  .mini-btn.approve { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
  .mini-btn.approve:hover { filter: brightness(.95); }
  .mini-btn.reject { background: var(--color-surface); color: var(--imp-bg); border-color: #f0c6b3; }
  .mini-btn.reject:hover { background: #fdf3ee; }
  .mini-btn.ghost { background: var(--color-surface); color: var(--color-ink-soft); border-color: var(--color-hairline); }
  .mini-btn.ghost:hover { background: var(--color-canvas-soft); color: var(--color-ink); }

  .inline-emp { display: inline-flex; align-items: center; gap: 8px; }
  .inline-emp-av {
    width: 24px; height: 24px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }
  .mono-sm { font-family: var(--mono); font-size: 11.5px; color: var(--color-ink-muted); letter-spacing: .02em; }

  .approval-row.is-approved { opacity: .65; }
  .approval-row.is-rejected { opacity: .55; }
  .approval-row.is-approved td b, .approval-row.is-rejected td b { color: var(--color-ink-muted); }

  /* ── Hire Wizard ─────────────────────────────── */
  .wizard-steps {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--color-surface);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .wiz-step {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    background: transparent; border: 0; border-right: 1px solid var(--color-hairline-soft);
    text-align: left; cursor: pointer;
    font-family: inherit; position: relative;
  }
  .wiz-step:last-child { border-right: 0; }
  .wiz-step:hover { background: var(--color-canvas-soft); }
  .wiz-step-num {
    width: 30px; height: 30px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--color-canvas-soft);
    border: 1px solid var(--color-hairline);
    font-family: var(--mono); font-weight: 700; font-size: 13px;
    color: var(--color-ink-muted);
    flex-shrink: 0;
  }
  .wiz-step.is-current .wiz-step-num { background: var(--color-ink); color: var(--color-canvas-soft); border-color: var(--color-ink); }
  .wiz-step.is-done .wiz-step-num { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
  .wiz-step.is-done .wiz-step-num svg { width: 14px; height: 14px; }
  .wiz-step-lbl { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--color-ink-muted); letter-spacing: -0.005em; }
  .wiz-step.is-current .wiz-step-lbl, .wiz-step.is-done .wiz-step-lbl { color: var(--color-ink); }
  .wiz-step-sub { font-family: var(--mono); font-size: 10.5px; color: var(--color-ink-faint); letter-spacing: .02em; margin-top: 2px; }

  .form-pane { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .form-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
  .form-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -0.015em; margin: -8px 0 4px; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .text-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .text-field.is-full { grid-column: 1 / -1; }
  .text-field label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
  .text-input-wrap { display: flex; align-items: stretch; background: var(--color-surface); border: 1px solid var(--color-hairline); border-radius: var(--radius-sm); overflow: hidden; }
  .text-input-wrap:focus-within { border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(31,168,160,.15); }
  .text-input-wrap input, .text-input-wrap select {
    flex: 1; border: 0; background: transparent; padding: 10px 12px;
    font-family: inherit; font-size: 13.5px; color: var(--color-ink); min-width: 0;
  }
  .text-input-wrap input:focus, .text-input-wrap select:focus { outline: none; }
  .text-input-wrap select { appearance: none; cursor: pointer; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--color-ink-muted) 50%), linear-gradient(135deg, var(--color-ink-muted) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 10px) 50%; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
  .text-prefix { padding: 10px 4px 10px 12px; font-family: var(--mono); font-weight: 700; color: var(--color-ink-muted); font-size: 13.5px; }

  .form-callout {
    background: var(--color-accent-soft);
    border: 1px solid #93D6CF;
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 12.5px; color: #06241F;
    display: flex; flex-direction: column; gap: 4px;
  }
  .form-callout-eyebrow {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: #06241F; font-weight: 700; margin-bottom: 4px;
  }

  .review-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px 32px;
  }
  .review-section-head {
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-ink-faint); font-weight: 700;
    padding-bottom: 8px; border-bottom: 1px solid var(--color-hairline-soft); margin-bottom: 4px;
  }
  .review-pipeline { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
  .pipe-step {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0; font-size: 12.5px; color: var(--color-ink-muted);
  }
  .pipe-step.done { color: var(--color-ink); }
  .pipe-num {
    width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--color-canvas-soft); border: 1px solid var(--color-hairline);
    font-family: var(--mono); font-weight: 700; font-size: 11px; color: var(--color-ink-muted);
    flex-shrink: 0;
  }
  .pipe-step.done .pipe-num { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .pipe-step.done .pipe-num svg { width: 11px; height: 11px; }

  .wizard-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 0 0;
    border-top: 1px solid var(--color-hairline-soft);
  }
  .primary-btn:disabled { cursor: not-allowed; }

  /* ── Onboarding ─────────────────────────────── */
  .onboard-progress { display: flex; align-items: center; gap: 12px; font-family: var(--mono); }
  .onboard-progress-num { font-size: 13px; font-weight: 700; color: var(--color-ink); letter-spacing: .02em; }
  .onboard-progress-bar { position: relative; width: 200px; height: 6px; background: var(--color-canvas-soft); border-radius: 999px; border: 1px solid var(--color-hairline-soft); overflow: hidden; }
  .onboard-progress-bar span { position: absolute; inset: 0 auto 0 0; background: var(--color-accent); border-radius: 999px; transition: width .25s; }
  .onboard-progress-pct { font-size: 12px; font-weight: 700; color: var(--color-accent); letter-spacing: .02em; }

  .onboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (min-width: 1400px) { .onboard-grid { grid-template-columns: repeat(4, 1fr); } }
  .check-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 11px 18px;
    border-bottom: 1px solid var(--color-hairline-soft);
    cursor: pointer;
  }
  .check-row:last-child { border-bottom: 0; }
  .check-row:hover { background: var(--color-canvas-soft); }
  .check-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--color-accent); margin-top: 2px; cursor: pointer; flex-shrink: 0; }
  .check-row.is-done .check-title { text-decoration: line-through; color: var(--color-ink-muted); }
  .check-row.is-done { opacity: .65; }
  .check-title { font-size: 13.5px; color: var(--color-ink); font-weight: 500; }
  .check-meta { font-family: var(--mono); font-size: 10.5px; color: var(--color-ink-muted); margin-top: 3px; letter-spacing: .02em; }
  .check-meta b { color: var(--color-ink-soft); font-weight: 700; }

  /* ── Probation review ────────────────────────── */
  .prob-row {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--color-hairline-soft);
  }
  .prob-row:last-child { border-bottom: 0; }
  .prob-row-body { flex: 1; min-width: 0; }
  .prob-row-label { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--color-ink); letter-spacing: -0.005em; }
  .prob-row-desc { font-size: 12px; color: var(--color-ink-muted); margin-top: 3px; }
  .prob-row-rating { display: inline-flex; gap: 4px; }
  .rating-btn {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--color-canvas-soft); border: 1px solid var(--color-hairline);
    font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--color-ink-muted);
    cursor: pointer;
  }
  .rating-btn:hover { border-color: var(--color-ink-faint); color: var(--color-ink); }
  .rating-btn.is-active { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }

  .decision-btn {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 14px;
    background: var(--color-surface);
    border: 1.5px solid var(--color-hairline);
    border-radius: var(--radius-sm);
    text-align: left; font-family: inherit; cursor: pointer; width: 100%;
  }
  .decision-btn:hover { background: var(--color-canvas-soft); }
  .decision-pip {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--color-ink-faint); flex-shrink: 0; margin-top: 2px;
    box-shadow: inset 0 0 0 2px #fff;
  }
  .decision-label { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--color-ink); }
  .decision-sub { font-family: var(--mono); font-size: 10.5px; color: var(--color-ink-muted); margin-top: 3px; letter-spacing: .02em; }

  /* ── Payslip detail drawer ────────────────── */
  .drawer-wide { width: 540px; }
  .payslip-summary {
    display: grid; grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: center; gap: 12px;
    padding: 14px 16px;
    background: var(--color-canvas-soft);
    border: 1px solid var(--color-hairline-soft);
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
  }
  .payslip-summary-lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
  .payslip-summary-val { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--color-ink); margin-top: 4px; letter-spacing: -0.01em; line-height: 1; }
  .payslip-summary-op { font-family: var(--mono); font-size: 18px; color: var(--color-ink-faint); font-weight: 700; }

  .payslip-section { margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--color-hairline-soft); }
  .payslip-section:first-child { border-top: 0; padding-top: 0; }
  .payslip-section-head { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; margin-bottom: 8px; }
  .payslip-line {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px solid var(--color-hairline-soft);
    font-size: 13px; color: var(--color-ink-soft);
  }
  .payslip-line:last-child { border-bottom: 0; }
  .payslip-line b { font-family: var(--mono); font-weight: 700; color: var(--color-ink); letter-spacing: .02em; }
  .payslip-line.payslip-total { padding-top: 9px; margin-top: 2px; border-top: 1.5px solid var(--color-ink); border-bottom: 0; font-weight: 700; color: var(--color-ink); }

  /* clickable rows */
  .data-table tbody tr[style*="cursor: pointer"]:hover { background: var(--color-canvas-soft); }

  /* ── Benefits ──────────────────────────────── */
  .benefit-bar { position: relative; height: 5px; background: var(--color-hairline); border-radius: 999px; overflow: hidden; }
  .benefit-bar span { position: absolute; inset: 0 auto 0 0; background: var(--color-accent); border-radius: 999px; transition: width .25s; }

  .modal-wide { width: 720px; max-width: 96vw; }
  .claim-plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .claim-plan {
    text-align: left; font-family: inherit; cursor: pointer;
    background: var(--color-surface); border: 1.5px solid var(--color-hairline);
    border-radius: var(--radius-sm); padding: 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .claim-plan:hover { border-color: var(--color-ink-faint); }
  .claim-plan.is-selected { border-color: var(--color-accent); background: var(--color-accent-soft); }
  .claim-plan-head { display: flex; align-items: baseline; justify-content: space-between; }
  .claim-plan-name { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: -0.005em; color: var(--color-ink); }
  .claim-plan-carrier { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--color-ink-muted); font-weight: 600; text-transform: uppercase; }
  .claim-plan-cap { font-family: var(--mono); font-size: 11.5px; color: var(--color-ink-soft); }
  .claim-plan-cap b { font-size: 14px; color: var(--color-ink); font-weight: 700; }
  .claim-plan-cap small { font-size: 10px; color: var(--color-ink-faint); margin-left: 6px; letter-spacing: .04em; }
  .claim-plan-note { font-size: 11.5px; color: var(--color-ink-muted); }

  .receipt-drop {
    border: 2px dashed var(--color-hairline);
    border-radius: var(--radius-md);
    padding: 32px 20px; text-align: center; cursor: pointer;
    background: var(--color-canvas-soft);
  }
  .receipt-drop:hover { border-color: var(--color-accent); background: var(--color-accent-soft); }
  .receipt-drop.has-file { border-style: solid; border-color: var(--color-accent); background: var(--color-accent-soft); padding: 16px; text-align: left; }
  .receipt-drop-icon { font-size: 22px; color: var(--color-ink-faint); margin-bottom: 8px; }
  .receipt-drop-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--color-ink); margin-bottom: 4px; }
  .receipt-drop-sub { font-family: var(--mono); font-size: 11px; color: var(--color-ink-muted); letter-spacing: .02em; }
  .receipt-thumb { display: flex; align-items: center; gap: 14px; }
  .receipt-thumb-icon {
    width: 44px; height: 56px; background: #fff; border: 1px solid var(--color-hairline);
    border-radius: 4px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--color-ink-muted);
    flex-shrink: 0;
  }
  .receipt-thumb-icon svg { width: 20px; height: 20px; }
  .receipt-name { font-size: 13.5px; font-weight: 600; color: var(--color-ink); }
  .receipt-size { font-family: var(--mono); font-size: 11px; color: var(--color-ink-muted); margin-top: 3px; letter-spacing: .02em; }

  .receipt-preview {
    background: #FCFAF5; border: 1px solid var(--color-hairline);
    border-radius: var(--radius-sm); padding: 14px 18px;
    margin-bottom: 12px;
    font-family: ui-monospace, monospace;
  }
  .receipt-preview-header { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px dashed var(--color-hairline); }
  .receipt-preview-merchant { font-weight: 700; color: var(--color-ink); }
  .receipt-preview-date { font-size: 11px; color: var(--color-ink-muted); }
  .receipt-preview-lines { padding-top: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
  .receipt-preview-lines div { display: flex; justify-content: space-between; }
  .receipt-preview-divider { border-top: 1px dashed var(--color-hairline); margin: 4px 0; }
  .receipt-preview-total { font-weight: 700; color: var(--color-ink); padding-top: 4px; }

  /* ── Shift Swap ────────────────────────────── */
  .swap-coworker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .swap-coworker {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--color-surface); border: 1.5px solid var(--color-hairline);
    border-radius: var(--radius-sm); padding: 12px;
    text-align: left; font-family: inherit; cursor: pointer;
  }
  .swap-coworker:hover { border-color: var(--color-ink-faint); }
  .swap-coworker.is-selected { border-color: var(--color-accent); background: var(--color-accent-soft); }
  .swap-coworker-av {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; color: #fff; flex-shrink: 0;
  }
  .swap-coworker-name { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--color-ink); }
  .swap-coworker-role { font-size: 11.5px; color: var(--color-ink-muted); margin-top: 1px; }
  .swap-coworker-hours { font-family: var(--mono); font-size: 10.5px; color: var(--color-ink-faint); margin-top: 5px; letter-spacing: .02em; }

  .swap-match { display: grid; grid-template-columns: 1fr 32px 1fr; gap: 14px; align-items: stretch; }
  .swap-arrow {
    display: flex; align-items: center; justify-content: center;
    color: var(--color-accent);
  }
  .swap-arrow svg { width: 26px; height: 26px; }
  .conflict-row { display: flex; align-items: center; gap: 6px; }
  .conflict-row svg { color: var(--color-accent); width: 12px; height: 12px; flex-shrink: 0; }
  .swap-side {
    background: var(--color-canvas-soft); border: 1px solid var(--color-hairline-soft);
    border-radius: var(--radius-sm); padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .swap-side-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
  .swap-side-eyebrow { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
  .swap-side-name { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--color-ink); }
  .swap-side-shifts { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .swap-shift {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--color-surface); border: 1.5px solid var(--color-hairline);
    border-radius: 8px; padding: 9px 12px;
    text-align: left; font-family: inherit; cursor: pointer;
    color: var(--color-ink-muted); font-size: 12.5px;
  }
  .swap-shift:hover { border-color: var(--color-ink-faint); color: var(--color-ink); }
  .swap-shift.is-selected { border-color: var(--color-accent); background: var(--color-accent-soft); color: #06241F; }
  .swap-shift-day { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; }
  .swap-shift b { color: var(--color-ink); font-weight: 700; }

  .swap-summary {
    background: var(--color-canvas-soft); border: 1px solid var(--color-hairline-soft);
    border-radius: var(--radius-sm); padding: 14px 18px;
    display: flex; flex-direction: column;
  }
  .swap-summary-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--color-hairline-soft);
    font-size: 13px;
  }
  .swap-summary-row:last-child { border-bottom: 0; }
  .swap-summary-lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--color-ink-muted); font-weight: 600; }
  .swap-summary-row b { font-family: var(--mono); font-weight: 700; color: var(--color-ink); letter-spacing: .02em; }

  /* tweak quick-tile for offboarding documents */
  .quick-tile span:first-of-type { flex: 1; }
  .quick-tile svg { color: var(--color-ink-muted); }

  /* ── Assets ────────────────────────────────── */
  .asset-cats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .asset-cat {
    background: var(--color-surface); border: 1.5px solid var(--color-hairline);
    border-radius: var(--radius-md); padding: 14px 14px 12px;
    cursor: pointer; font-family: inherit;
    text-align: left; display: flex; flex-direction: column; gap: 6px;
    position: relative;
  }
  .asset-cat:hover { border-color: var(--color-ink-faint); }
  .asset-cat.is-active { border-color: var(--color-accent); background: var(--color-accent-soft); }
  .asset-cat-ico { color: var(--color-ink-soft); line-height: 0; }
  .asset-cat-ico svg { width: 24px; height: 24px; }
  .asset-cat.is-active .asset-cat-ico { color: var(--color-accent); }
  .asset-cat-label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
  .asset-cat.is-active .asset-cat-label { color: #06241F; }
  .asset-cat-count { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--color-ink); letter-spacing: -0.02em; line-height: 1; }
  .asset-cat-count small { font-family: var(--mono); font-size: 12px; color: var(--color-ink-faint); font-weight: 600; margin-left: 4px; letter-spacing: .02em; }
  .asset-cat-order { font-family: var(--mono); font-size: 10px; color: var(--imp-bg); font-weight: 700; letter-spacing: .04em; margin-top: -2px; }

  /* ── Org Chart ─────────────────────────────── */
  .org-canvas-card { overflow: auto; max-height: 720px; }
  .org-canvas { padding: 20px; transition: transform .2s; min-width: max-content; }
  .org-node { display: flex; flex-direction: column; align-items: center; }
  .org-card {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--color-surface);
    border: 1.5px solid var(--color-hairline);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    cursor: pointer; font-family: inherit;
    min-width: 220px;
    transition: border-color .15s, box-shadow .15s;
    position: relative;
  }
  .org-card:hover { border-color: var(--color-ink-faint); }
  .org-card.is-focused { border-width: 2px; box-shadow: 0 4px 12px rgba(14,27,44,.08); }
  .org-av {
    width: 32px; height: 32px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 11px; flex-shrink: 0;
  }
  .org-card-body { flex: 1; min-width: 0; }
  .org-name { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--color-ink); letter-spacing: -0.005em; }
  .org-role { font-size: 11.5px; color: var(--color-ink-muted); margin-top: 1px; }
  .org-reports { font-family: var(--mono); font-size: 9.5px; color: var(--color-ink-faint); margin-top: 3px; letter-spacing: .04em; font-weight: 600; text-transform: uppercase; }
  .org-toggle {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--color-canvas-soft); border: 1px solid var(--color-hairline);
    color: var(--color-ink-soft); font-family: var(--mono); font-weight: 700; font-size: 14px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .org-toggle:hover { background: var(--color-accent-soft); border-color: var(--color-accent); color: var(--color-accent); }
  .org-children {
    display: flex; gap: 16px;
    padding-top: 24px;
    position: relative;
  }
  .org-children::before {
    content: ""; position: absolute; top: 0; left: 50%; width: 1.5px; height: 12px;
    background: var(--color-hairline);
  }
  .org-children::after {
    content: ""; position: absolute; top: 12px; left: 0; right: 0; height: 1.5px;
    background: var(--color-hairline);
  }
  .org-children > .org-node { position: relative; padding-top: 12px; }
  .org-children > .org-node::before {
    content: ""; position: absolute; top: 0; left: 50%; width: 1.5px; height: 12px;
    background: var(--color-hairline);
  }
  .org-children > .org-node:only-child::before { display: none; }

  .zoom-controls {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--color-surface); border: 1px solid var(--color-hairline);
    border-radius: var(--radius-sm); padding: 4px;
  }
  .zoom-controls button {
    background: transparent; border: 0; cursor: pointer;
    font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--color-ink-soft);
    width: 26px; height: 26px; border-radius: 4px;
  }
  .zoom-controls button:hover { background: var(--color-canvas-soft); color: var(--color-ink); }
  .zoom-controls .zoom-reset {
    width: auto; padding: 0 8px; font-size: 10px; letter-spacing: .08em;
  }
  .zoom-controls span {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--color-ink-muted);
    letter-spacing: .04em; min-width: 38px; text-align: center;
  }

  /* ── Command Palette (⌘K) ──────────────────── */
  .palette-overlay {
    position: fixed; inset: 0; background: rgba(14,27,44,.5);
    z-index: 90; display: flex; align-items: flex-start; justify-content: center;
    padding-top: 14vh; animation: fadeIn .15s;
  }
  .palette {
    width: 560px; max-width: 92vw;
    background: var(--color-surface);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md);
    box-shadow: 0 24px 60px rgba(14,27,44,.32);
    overflow: hidden;
    animation: slideIn .2s cubic-bezier(.4,0,.2,1);
  }
  .palette-input-wrap {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--color-hairline-soft);
    color: var(--color-ink-muted);
  }
  .palette-input-wrap input {
    flex: 1; border: 0; background: transparent;
    font-family: inherit; font-size: 16px; color: var(--color-ink);
    min-width: 0;
  }
  .palette-input-wrap input:focus { outline: none; }
  .palette-input-wrap kbd {
    font-family: var(--mono); font-size: 10px; padding: 3px 7px;
    background: var(--color-canvas-soft); border: 1px solid var(--color-hairline);
