    border-radius: 4px; color: var(--color-ink-muted); letter-spacing: .04em;
  }
  .palette-results { max-height: 360px; overflow-y: auto; padding: 4px; }
  .palette-empty {
    padding: 32px 16px; text-align: center;
    color: var(--color-ink-faint); font-size: 13px;
  }
  .palette-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%; background: transparent; border: 0;
    padding: 10px 12px; border-radius: 8px;
    cursor: pointer; font-family: inherit; text-align: left;
  }
  .palette-item.is-selected { background: var(--color-accent-soft); }
  .palette-kind {
    font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 4px;
    background: var(--color-canvas-soft); color: var(--color-ink-faint); font-weight: 700;
    min-width: 88px; text-align: center;
  }
  .palette-item.is-selected .palette-kind { background: var(--color-ink); color: var(--color-canvas-soft); }
  .palette-label { font-size: 13.5px; font-weight: 600; color: var(--color-ink); }
  .palette-sub { font-size: 11.5px; color: var(--color-ink-muted); margin-top: 2px; }
  .palette-enter {
    font-family: var(--mono); font-size: 14px; font-weight: 700;
    color: var(--color-ink-faint); opacity: 0;
  }
  .palette-item.is-selected .palette-enter { opacity: 1; color: var(--color-accent); }
  .palette-foot {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; background: var(--color-canvas-soft);
    border-top: 1px solid var(--color-hairline-soft);
    font-family: var(--mono); font-size: 10.5px; color: var(--color-ink-muted);
    letter-spacing: .04em;
  }
  .palette-foot kbd {
    font-family: var(--mono); font-size: 10px; padding: 2px 6px;
    background: var(--color-surface); border: 1px solid var(--color-hairline);
    border-radius: 4px; color: var(--color-ink-soft); margin-right: 4px;
  }

  /* ── Employee Hub ──────────────────────────── */
  .drawer-x-wide { width: 720px; max-width: 96vw; }
  .hub-tabs {
    display: grid; grid-template-columns: repeat(9, 1fr);
    border-top: 1px solid var(--color-hairline-soft);
    border-bottom: 1px solid var(--color-hairline);
    background: var(--color-canvas-soft);
  }
  .hub-tab {
    background: transparent; border: 0; padding: 10px 8px;
    font-family: inherit; cursor: pointer; text-align: center;
    border-right: 1px solid var(--color-hairline-soft);
    color: var(--color-ink-muted);
    transition: background .15s;
  }
  .hub-tab:last-child { border-right: 0; }
  .hub-tab:hover { background: var(--color-canvas); color: var(--color-ink); }
  .hub-tab.is-active { background: var(--color-surface); color: var(--color-ink); }
  .hub-tab.is-active .hub-tab-label { color: var(--color-accent); }
  .hub-tab-label { font-family: var(--font-display); font-weight: 600; font-size: 12.5px; letter-spacing: -0.005em; }
  .hub-tab-sub { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; margin-top: 2px; }

  /* Timeline tab */
  .hub-timeline { display: flex; flex-direction: column; gap: 16px; position: relative; padding-left: 6px; }
  .hub-timeline::before {
    content: ""; position: absolute; left: 13px; top: 8px; bottom: 8px;
    width: 1.5px; background: var(--color-hairline);
  }
  .hub-timeline-item { display: flex; align-items: flex-start; gap: 14px; }
  .hub-timeline-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--color-canvas-soft); border: 1.5px solid var(--color-accent);
    color: var(--color-accent); font-family: var(--mono); font-weight: 700; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    z-index: 1;
  }
  .hub-timeline-date { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--color-ink-faint); font-weight: 700; text-transform: uppercase; }
  .hub-timeline-title { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--color-ink); margin-top: 2px; }
  .hub-timeline-sub { font-size: 12.5px; color: var(--color-ink-muted); margin-top: 2px; }

  /* Plans */
  .hub-plan-list { display: flex; flex-direction: column; gap: 8px; }
  .hub-plan {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    background: var(--color-canvas-soft);
    border: 1px solid var(--color-hairline-soft);
    border-radius: var(--radius-sm);
  }
  .hub-plan-name { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--color-ink); min-width: 180px; }
  .hub-plan .benefit-bar { width: 120px; }
  .hub-plan-cap { font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--color-ink); letter-spacing: .02em; }
  .hub-plan-cap small { font-weight: 500; color: var(--color-ink-muted); margin-left: 4px; font-size: 10.5px; }

  /* Documents */
  .hub-docs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hub-doc {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: var(--color-canvas-soft);
    border: 1px solid var(--color-hairline-soft);

  .home-pin {

  .hire-prev-id {

  /* ── Employee Detail Page (full-screen) ──── */
  .emp-page { padding-top: 0; }

  .emp-header-meta { font-family: var(--mono); font-size: 12px; color: var(--color-ink-muted); margin-top: 4px; letter-spacing: .02em; }

  .emp-tab:hover { background: var(--color-canvas-soft); color: var(--color-ink); }
  .emp-tab.is-active { background: var(--color-accent-soft); border-left-color: var(--color-accent); color: var(--color-ink); font-weight: 700; }

  .emp-content { min-width: 0; }
  .emp-benefits { display: flex; flex-direction: column; gap: 16px; }

  /* Summary strip */
  .benefit-summary-strip {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;

  .benefit-summary-lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 700; }
  .benefit-summary-val { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; margin-top: 6px; color: var(--color-ink); }

  /* Section */
  .emp-bsec { background: var(--color-surface); border: 1px solid var(--color-hairline); border-radius: var(--radius-md); overflow: hidden; }
  .emp-bsec-head { display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 18px 10px; border-bottom: 1px solid var(--color-hairline-soft); }
  .emp-bsec-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; letter-spacing: -0.015em; margin: 4px 0 0; }

  .add-plan-inline {

  .add-plan-chip {

  .pf-stat-val { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--color-ink); margin-top: 4px; letter-spacing: -0.015em; line-height: 1; }

  /* ── Hire wizard · clustered sections ────── */
  .hire-sections { display: flex; flex-direction: column; gap: 12px; }
  .hire-section {
    background: var(--color-surface); border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md); overflow: hidden;

  .hire-section-ico {
    width: 36px; height: 36px; border-radius: 10px;

  .hire-section-title-en { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; color: var(--color-ink-faint); margin-top: 2px; font-weight: 600; text-transform: uppercase; }
  .hire-section-sub { font-size: 12px; color: var(--color-ink-muted); margin-top: 4px; }
  .hire-section-check { color: var(--color-accent); flex-shrink: 0; margin-top: 8px; }
  .hire-section-check svg { width: 18px; height: 18px; }
  .hire-section-chev { color: var(--color-ink-faint); margin-top: 12px; transition: transform .2s; flex-shrink: 0; }
  .hire-section-chev.is-open { transform: rotate(180deg); color: var(--color-accent); }
  .hire-section-body {
    padding: 0 20px 20px 70px;
    border-top: 1px solid var(--color-hairline-soft);
