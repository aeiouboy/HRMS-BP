const { DesignCanvas, DCSection, DCArtboard, TweaksPanel, TweakSection, TweakColor, TweakRadio, TweakToggle, useTweaks } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "teal",
  "density": "regular",
  "dark": false
}/*EDITMODE-END*/;

const ACCENT_PALETTES = {
  teal:   { accent: "#1FA8A0", soft: "#D6EEEC" },
  indigo: { accent: "#5B6CE0", soft: "#E1E4FB" },
  forest: { accent: "#2F8A6B", soft: "#D1FAE5" },
  plum:   { accent: "#9333EA", soft: "#F3E8FF" },
};

function applyTweaks(t) {
  const root = document.documentElement;
  const p = ACCENT_PALETTES[t.accent] || ACCENT_PALETTES.teal;
  root.style.setProperty("--color-accent", p.accent);
  root.style.setProperty("--color-accent-soft", p.soft);
  root.style.setProperty("--color-brand", p.accent);
  root.style.setProperty("--color-brand-tint", p.soft);
  const scale = t.density === "compact" ? 0.92 : t.density === "comfy" ? 1.08 : 1;
  root.style.setProperty("--density-scale", scale);
}

const Wrap = ({ persona, nav, badge, children }) => (

            <Wrap persona="manager" nav="time"><window.Roster_Regional/></Wrap>
          </DCArtboard>
          <DCArtboard id="wf-roster" label="WF-1 · Manager — Weekly Roster Builder (กะการทำงาน) · v1" width={1480} height={1400}>
            <Wrap persona="manager" nav="time"><window.Roster_Manager/></Wrap>
          </DCArtboard>
          <DCArtboard id="wf-swap" label="WF-2 · Manager — Shift Swap Approval (สลับกะ)" width={1360} height={1300}>
            <Wrap persona="manager" nav="inbox" badge="2 รออนุมัติ"><window.ShiftSwap_Manager/></Wrap>
          </DCArtboard>
          <DCArtboard id="wf-asset" label="WF-3 · HR Admin — Asset Management (เครื่องแบบ + IT + Badge)" width={1480} height={1500}>
            <Wrap persona="admin" nav="employee-center"><window.Asset_Admin/></Wrap>
          </DCArtboard>
        </DCSection>

        {/* ════════════════════════════════════════════════════════════════
            📦  ARCHIVE — earlier designs kept for comparison
            ════════════════════════════════════════════════════════════════ */}
        <DCSection id="archive" title="📦 Archive · เปรียบเทียบ + Legacy v1 (รอ migrate)">
          {/* Time original — superseded by Darwinbox-style above */}
          <DCArtboard id="m3-emp"   label="3A · Employee — ลงเวลา (original v1)"   width={1280} height={1200}><Wrap persona="employee" nav="time"><window.TM_Employee/></Wrap></DCArtboard>
          <DCArtboard id="m3-mgr"   label="3B · Manager (original v1)"              width={1280} height={1280}><Wrap persona="manager"  nav="time" badge="5 รออนุมัติ"><window.TM_Manager/></Wrap></DCArtboard>
          <DCArtboard id="m3-admin" label="3C · HR Admin (original v1)"             width={1280} height={1200}><Wrap persona="admin"    nav="time"><window.TM_Admin/></Wrap></DCArtboard>
          <DCArtboard id="m3-hris"  label="3D · HRIS (original v1)"                 width={1280} height={1280}><Wrap persona="hris"     nav="time"><window.TM_Hris/></Wrap></DCArtboard>
          <DCArtboard id="m3-spd"   label="3E · SPD (original v1)"                  width={1280} height={1150}><Wrap persona="spd"      nav="time"><window.TM_Spd/></Wrap></DCArtboard>
          {/* Legacy v1 screens — pending migration to Humi v2 shell */}
          <DCArtboard id="lg-requests" label="LG-1 · Employee — Request Center hub (v1)" width={1360} height={1400}>
            <LegacyWrap persona="employee" current="requests"><window.RequestsScreen onNav={() => {}}/></LegacyWrap>
          </DCArtboard>
          <DCArtboard id="lg-announce" label="LG-2 · Employee — Announcements feed (v1)" width={1360} height={1300}>
            <LegacyWrap persona="employee" current="announce"><window.AnnouncementsScreen onNav={() => {}}/></LegacyWrap>
          </DCArtboard>
          <DCArtboard id="lg-perm" label="LG-3 · HR Admin — Role Permissions (RBP editor, v1)" width={1360} height={1200}>
            <LegacyWrap persona="admin" current="admin" title="สิทธิ์ตามบทบาท" subtitle="กำหนดสิ่งที่แต่ละบทบาทเห็นและทำได้">
              <window.AdminPermissions Ic={window.I}/>
            </LegacyWrap>
          </DCArtboard>
          <DCArtboard id="lg-inbox" label="LG-4 · HR Admin — Workflow Inbox (queue + approval chain, v1)" width={1360} height={1300}>
            <LegacyWrap persona="admin" current="admin" title="กล่องงาน" subtitle="คำขออนุมัติทั้งหมด">
              <window.AdminInbox Ic={window.I} workflows={window.AdminData.WORKFLOWS} focusedId={null} onClose={() => {}}/>
            </LegacyWrap>
          </DCArtboard>
        </DCSection>

      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Brand · สี"/>
        <TweakColor label="Accent" value={ACCENT_PALETTES[t.accent]?.accent || "#1FA8A0"}
                    options={["#1FA8A0","#5B6CE0","#2F8A6B","#9333EA"]}
                    onChange={hex => {
                      const key = Object.keys(ACCENT_PALETTES).find(k => ACCENT_PALETTES[k].accent === hex) || "teal";
                      setTweak("accent", key);
                    }}/>
        <TweakSection label="Layout"/>
        <TweakRadio label="ความหนาแน่น" value={t.density}
                    options={["compact","regular","comfy"]}
                    onChange={v => setTweak("density", v)}/>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
